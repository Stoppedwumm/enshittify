[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/media",
    "crates/render",
    "crates/audio",
    "crates/export",
    "crates/sync",
    "crates/ui",
    "crates/relay",
    "crates/app",
    "tests",
]
default-members = [
    "crates/core",
    "crates/media",
    "crates/render",
    "crates/audio",
    "crates/export",
    "crates/sync",
    "crates/ui",
    "crates/relay",
    "crates/app",
    "tests",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
publish = false

[workspace.dependencies]
cutroom-core = { path = "crates/core" }
cutroom-media = { path = "crates/media" }
cutroom-render = { path = "crates/render" }
cutroom-audio = { path = "crates/audio" }
cutroom-export = { path = "crates/export" }
cutroom-sync = { path = "crates/sync" }
cutroom-ui = { path = "crates/ui" }

anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["ws"] }
blake3 = { version = "=1.8.7", features = ["mmap", "rayon"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
cpal = "=0.18.2"
crossbeam-channel = "=0.5.17"
directories = "=6.0.0"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11", "persistence"] }
egui = "=0.36.2"
egui_dock = { version = "=0.21.1", features = ["serde"] }
egui_kittest = "=0.36.2"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
fluent-bundle = "=0.16.0"
futures-util = "=0.3.34"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
loro = "=1.16.2"
lru = "=0.18.5"
parking_lot = "=0.12.5"
pollster = "=1.0.1"
postcard = { version = "=1.1.3", features = ["use-std"] }
proptest = "=1.11.0"
rayon = "=1.12.0"
rfd = "=0.17.2"
rtrb = "=0.4.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["full"] }
tokio-tungstenite = "=0.30.0"
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ulid = { version = "=3.0.0", features = ["serde"] }
unic-langid = { version = "=0.9.6", features = ["macros"] }
wgpu = "=30.0.1"
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[profile.dev]
debug = "line-tables-only"

# Dependencies (decoders, Loro, wgpu) are optimised even in dev builds so the
# editor stays interactive; their debug info is dropped to keep target/ small.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
debug = 1
