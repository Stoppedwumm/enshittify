# Cutroom default keyboard shortcuts.
#
# Each action lists bindings for Windows/Linux (`windows`) and macOS (`macos`).
# `context` scopes the binding: "global" works everywhere (except while typing
# in a text field), "timeline" / "media" / "player" only while that panel is
# focused. Users rebind in Tools → Keyboard Shortcuts; overrides are stored
# per user, never in the project.
#
# Key names: letters, digits, F1–F12, Left/Right/Up/Down, Home/End, Enter,
# Space, Delete, Backspace, Escape, Tab, [ ] , . / = - and "Click" (mouse).
# Modifiers: Ctrl, Alt (= Option), Shift, Cmd (macOS only).

[new_project]
context = "global"
windows = ["Ctrl+N"]
macos = ["Cmd+N"]

[open_project]
context = "global"
windows = ["Ctrl+O"]
macos = ["Cmd+O"]

