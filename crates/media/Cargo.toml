[package]
name = "cutroom-media"
description = "Cutroom media: probe, hashing, decode (CLI and native FFmpeg backends), frame cache, thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Native, dynamically linked FFmpeg 6–8 via ffmpeg-next. Needs FFmpeg dev
# libraries + pkg-config (Linux/macOS) or FFMPEG_DIR (Windows).
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
blake3.workspace = true
crossbeam-channel.workspace = true
cutroom-core.workspace = true
ffmpeg-next = { workspace = true, optional = true }
image.workspace = true
lru.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
